<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOBYLYTY</title>
  <meta name="description" content="Gestion de garage">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1f26" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOBYLYTY">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Chargement -->
  <div id="viewLoading" class="center">
    <div class="card">
      <h1 class="logo">MOBYLYTY</h1>
      <p class="sub">Chargement…</p>
    </div>
  </div>

  <!-- Connexion -->
  <div id="viewLogin" class="center hidden">
    <div class="card">
      <h1 class="logo">MOBYLYTY</h1>
      <p class="sub">Gestion de garage</p>
      <div id="googleBtn"></div>
      <div id="loginMessage" class="message"></div>
      <div class="version js-version"></div>
    </div>
  </div>

  <!-- Application -->
  <div id="viewApp" class="hidden">
    <header>
      <div>
        <div class="brand">MOBYLYTY</div>
        <div id="userLabel" class="user"></div>
      </div>
      <button id="logoutBtn" class="btn-secondary" type="button">Se déconnecter</button>
    </header>

    <main>
      <!-- Liste -->
      <section id="listView">
        <div class="title-row">
          <h2 id="vehiclesTitle">Mes véhicules</h2>
          <button id="addBtn" class="btn-primary" type="button">Ajouter un véhicule</button>
        </div>
        <div id="listMessage" class="message"></div>
        <div id="vehicleList" class="grid"></div>
      </section>

      <!-- Fiche -->
      <section id="detailView" class="hidden">
        <div class="toolbar">
          <button id="backBtn" class="btn-secondary" type="button">Retour à mes véhicules</button>
          <button id="editBtn" class="btn-secondary hidden" type="button">Modifier</button>
        </div>
        <div id="detailMessage" class="message"></div>
        <div id="detailContent"></div>
      </section>

      <!-- Formulaire -->
      <section id="formView" class="hidden">
        <h2 id="formTitle">Nouveau véhicule</h2>
        <form id="vehicleForm" novalidate>
          <fieldset class="section">
            <legend>Identité</legend>
            <label>Nom<span class="req">*</span><input name="name" maxlength="80" autocomplete="off"></label>
            <label>Catégorie<span class="req">*</span><select name="category"></select></label>
            <label>Marque<input name="make" maxlength="60" autocomplete="off"></label>
            <label>Modèle<input name="model" maxlength="60" autocomplete="off"></label>
            <label>Version<input name="version" maxlength="60" autocomplete="off"></label>
            <label>Année<input name="year" inputmode="numeric" maxlength="4" autocomplete="off"></label>
            <label>Statut<select name="status"></select></label>
          </fieldset>

          <fieldset class="section">
            <legend>Informations</legend>
            <label>Immatriculation<input name="registration" maxlength="20" autocapitalize="characters" autocomplete="off"></label>
            <label>N° de série (VIN)<input name="vin_serial" maxlength="40" autocapitalize="characters" autocomplete="off"></label>
            <label>Date d'achat<input name="purchase_date" type="date"></label>
          </fieldset>

          <fieldset class="section">
            <legend>Compteur</legend>
            <label>Unité<span class="req">*</span><select name="counter_unit"></select></label>
            <label>Compteur à l'achat<input name="purchase_counter" inputmode="decimal" autocomplete="off"></label>
            <label id="currentCounterField">Compteur actuel<input name="current_counter" inputmode="decimal" autocomplete="off"></label>
          </fieldset>

          <fieldset class="section">
            <legend>Finances</legend>
            <label>Prix d'achat (€)<input name="purchase_price" inputmode="decimal" autocomplete="off"></label>
          </fieldset>

          <div id="formMessage" class="message"></div>
          <div class="form-actions">
            <button id="cancelBtn" class="btn-secondary" type="button">Annuler</button>
            <button id="saveBtn" class="btn-primary" type="submit">Enregistrer</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="js-version"></footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <!-- Bibliothèque officielle Google, chargée après nos scripts -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>
</body>
</html>
