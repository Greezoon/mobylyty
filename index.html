<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOBYLYTY</title>
  <style>
    :root { --bg:#f4f5f7; --card:#ffffff; --text:#1d1f23; --muted:#6b7280; --ok:#15803d; --ko:#b91c1c; --btn:#1d1f23; --btnText:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111318; --card:#1c1f26; --text:#e8eaed; --muted:#9aa0a6; --ok:#4ade80; --ko:#f87171; --btn:#e8eaed; --btnText:#111318; }
    }
    body {
      margin:0; min-height:100vh; padding:20px; box-sizing:border-box;
      display:flex; align-items:center; justify-content:center;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:var(--bg); color:var(--text);
    }
    .card {
      background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:420px;
      box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center;
    }
    h1 { margin:0 0 6px; letter-spacing:.08em; }
    .sub { margin:0 0 24px; color:var(--muted); }
    .hidden { display:none; }
    #googleBtn { display:flex; justify-content:center; min-height:44px; }
    #message { margin-top:16px; font-size:.9rem; color:var(--ko); min-height:1.2em; }
    #hello { font-size:1.2rem; font-weight:600; margin:0 0 4px; }
    #role { color:var(--muted); margin:0 0 20px; }
    button {
      background:var(--btn); color:var(--btnText); border:0; border-radius:999px;
      padding:10px 20px; font-size:1rem; cursor:pointer;
    }
    #version { margin-top:24px; font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>MOBYLYTY</h1>
    <p class="sub">Gestion de garage</p>

    <div id="viewLoading">Chargement…</div>

    <div id="viewLogin" class="hidden">
      <div id="googleBtn"></div>
    </div>

    <div id="viewConnected" class="hidden">
      <p id="hello"></p>
      <p id="role"></p>
      <button id="logoutBtn" type="button">Se déconnecter</button>
    </div>

    <div id="message"></div>
    <div id="version"></div>
  </div>

  <script>
    // ===== Configuration (ces deux valeurs ne sont pas secrètes) =====
    const API_URL = 'https://script.google.com/macros/s/AKfycbxIt6yHFtICtz4fNYFtDXf1pTOVNFpTryOmaVaEJpJx3iQWsjuL67MpOUykYVk_xNDC/exec';
    const CLIENT_ID = '504887638811-f1n0jr8jtktedmv775v25vdq8m9bjdku.apps.googleusercontent.com';
    const TOKEN_KEY = 'mobylyty_token';

    // ===== Appel de l'API (POST en texte brut : pas de jeton dans l'adresse) =====
    async function api(action, payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      });
      return res.json();
    }

    // ===== Affichage =====
    function show(view) {
      ['viewLoading', 'viewLogin', 'viewConnected'].forEach(function (id) {
        document.getElementById(id).classList.toggle('hidden', id !== view);
      });
    }

    function setMessage(text) {
      document.getElementById('message').textContent = text || '';
    }

    function showConnected(user) {
      document.getElementById('hello').textContent = 'Bonjour ' + user.name;
      document.getElementById('role').textContent = 'Rôle : ' + (user.role || '-');
      setMessage('');
      show('viewConnected');
    }

    // ===== Bouton Google =====
    let gisReady = false;
    let wantButton = false;

    function onGisLoad() {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogleCredential });
      gisReady = true;
      if (wantButton) renderGoogleButton();
    }

    function renderGoogleButton() {
      wantButton = true;
      if (!gisReady) return;
      google.accounts.id.renderButton(document.getElementById('googleBtn'), {
        theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'fr'
      });
    }

    function showLogin(message) {
      localStorage.removeItem(TOKEN_KEY);
      show('viewLogin');
      renderGoogleButton();
      setMessage(message);
    }

    // ===== Connexion / déconnexion =====
    async function onGoogleCredential(response) {
      show('viewLoading');
      try {
        const res = await api('login', { idToken: response.credential });
        if (!res.ok) return showLogin(res.error);
        localStorage.setItem(TOKEN_KEY, res.data.token);
        showConnected(res.data.user);
      } catch (err) {
        showLogin('API injoignable : ' + err.message);
      }
    }

    async function logout() {
      const token = localStorage.getItem(TOKEN_KEY);
      show('viewLoading');
      try { await api('logout', { token: token }); } catch (err) { /* la session locale est supprimée quoi qu'il arrive */ }
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
      showLogin('');
    }

    // ===== Démarrage =====
    async function start() {
      document.getElementById('logoutBtn').addEventListener('click', logout);

      fetch(API_URL + '?action=ping')
        .then(function (r) { return r.json(); })
        .then(function (d) { document.getElementById('version').textContent = 'Version ' + d.version; })
        .catch(function () { document.getElementById('version').textContent = 'API injoignable'; });

      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return showLogin('');
      try {
        const res = await api('me', { token: token });
        if (res.ok) showConnected(res.data.user);
        else showLogin(res.code === 'AUTH' ? '' : res.error);
      } catch (err) {
        showLogin('API injoignable : ' + err.message);
      }
    }

    start();
  </script>

  <!-- Bibliothèque officielle Google, chargée après notre script -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>
</body>
</html>
